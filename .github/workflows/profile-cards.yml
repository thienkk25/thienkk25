name: Update Profile Cards

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: thienkk25/github-profile-summary-cards@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: thienkk25
          BRANCH_NAME: cards-temp
          UTC_OFFSET: 7

      # Copy generated cards to assets/cards/ on main branch
      - name: Copy cards to assets
        run: |
          git fetch origin cards-temp || exit 0
          git checkout origin/cards-temp -- profile-summary-card-output/tokyonight/ 2>/dev/null || exit 0
          mkdir -p assets/cards
          cp profile-summary-card-output/tokyonight/*.svg assets/cards/
          rm -rf profile-summary-card-output

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cards/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "📊 Auto-update profile summary cards"
          git push origin main
